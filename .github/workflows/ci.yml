name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intern_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intern_project"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intern_project?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3005/api
      SHIPPING_FEE_PER_SHOP: 30000
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_STORE: redis
      RATE_LIMIT_FAILURE_MODE: closed
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate -w @intern-project/api

      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test -w @intern-project/api -- --runInBand

      - name: Web unit tests
        run: npm test -w @intern-project/web -- --runInBand

      - name: End-to-end tests
        run: npm run test:e2e -w @intern-project/api

      - name: Production builds
        run: npm run build
